[workspace]
resolver = "2"
members = [
  ".",
  "crates/rustsolid-foundation",
  "crates/rustsolid-predicates",
  "crates/rustsolid-geometry",
  "crates/rustsolid-source",
  "crates/rustsolid-construct",
  "crates/rustsolid-validation",
  "crates/rustsolid-intersect",
  "crates/rustsolid-topology",
  "crates/rustsolid-uv",
]
default-members = ["."]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
robust = "1.2.0"
earcutr = "0.5.0"
geo = "0.33.1"

[package]
name = "rustsolid"
autobins = false
version = "0.40.0"
edition = "2021"
license = "MPL-2.0"
description = "An independent Rust geometric modeling kernel for Gefest CAD"
repository = "https://github.com/boltholds/rustsolid"
readme = "README.md"
keywords = ["cad", "geometry", "brep", "solid-modeling"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
earcutr.workspace = true
rustsolid-foundation = { path = "crates/rustsolid-foundation" }
rustsolid-predicates = { path = "crates/rustsolid-predicates" }
rustsolid-geometry = { path = "crates/rustsolid-geometry" }
rustsolid-intersect = { path = "crates/rustsolid-intersect" }
rustsolid-topology = { path = "crates/rustsolid-topology" }

[dev-dependencies]
rustsolid-construct = { path = "crates/rustsolid-construct" }
rustsolid-source = { path = "crates/rustsolid-source" }
rustsolid-validation = { path = "crates/rustsolid-validation" }

[[bin]]
name = "gefest-geometry"
path = "src/bin/gefest-geometry.rs"
