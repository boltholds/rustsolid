name: RustSolid CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Compile and test (stable Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test library, integration tests and CLI
        run: cargo test --all-targets
      - name: Independent source-controlled regression cases
        run: cargo test --test regression_corpus
      - name: Mandatory operator contract gate (analytic, metamorphic, boundaries)
        run: cargo test --test operator_contracts
      - name: Independent surface intersection mathematical contracts
        run: cargo test --test surface_intersection_contracts
      - name: Independent B-rep face trimming contracts
        run: cargo test --test trimmed_intersections
      - name: Validate versioned official Parasolid capability evidence
        run: python3 tests/validate_parasolid_capabilities.py
      - name: First-party intersection graph/provenance contracts
        run: cargo test --test intersection_graph
      - name: Check release compilation
        run: cargo check --release --all-targets
      - name: JSON CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"block","origin":[0,0,0],"width":2,"height":3,"depth":4}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["solid"]["mass"]["volume"] == 24.0, r'
      - name: Regression report CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"regression_corpus"}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["data"]["total"] == 20 and r["data"]["failed"] == 0, r'
      - name: Surface intersection CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"intersect_surfaces","first":{"kind":"plane","origin":[0,3,0],"x_axis":[1,0,0],"y_axis":[0,0,-1]},"second":{"kind":"cylinder","origin":[0,0,0],"radius":2,"x_axis":[1,0,0],"y_axis":[0,0,-1]}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["data"]["kind"]=="crossing" and r["data"]["curves"][0]["kind"]=="periodic_section" and r["data"]["certificate"]["max_residual_first"]<1e-8, r'
      - name: Bounded B-rep intersection CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"intersect_faces","first":{"source":{"kind":"block","origin":[-3,2,-3],"width":6,"height":1,"depth":6},"face_id":0},"second":{"source":{"kind":"analytic_cylinder","origin":[0,0,0],"radius":2,"height":5},"face_id":2}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["data"]["kind"]=="segments" and len(r["data"]["branches"])==1 and r["data"]["branches"][0]["closed"], r'
      - name: Intersection graph API CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"intersection_graph","first":{"source":{"kind":"block","origin":[-3,2,-3],"width":6,"height":1,"depth":6},"face_id":0},"second":{"source":{"kind":"analytic_cylinder","origin":[0,0,0],"radius":2,"height":5},"face_id":2}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["data"]["kind"]=="ready" and len(r["data"]["arcs"])==1 and r["data"]["arcs"][0]["closed"] and r["data"]["topology_committed"] is False, r'
