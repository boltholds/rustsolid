name: RustSolid CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Compile and test (stable Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test library, integration tests and CLI
        run: cargo test --all-targets
      - name: Independent source-controlled regression cases
        run: cargo test --test regression_corpus
      - name: Mandatory operator contract gate (analytic, metamorphic, boundaries)
        run: cargo test --test operator_contracts
      - name: Independent surface intersection mathematical contracts
        run: cargo test --test surface_intersection_contracts
      - name: Independent B-rep face trimming contracts
        run: cargo test --test trimmed_intersections
      - name: Validate versioned official Parasolid capability evidence
        run: python3 tests/validate_parasolid_capabilities.py
      - name: First-party intersection graph/provenance contracts
        run: cargo test --test intersection_graph
      - name: Pinned symbolic topology delta planning contracts
        run: cargo test --test topology_delta_plan
      - name: Sparse generational BrepArena and atomic command regressions
        run: cargo test --test brep_arena
      - name: Certified exact box Boolean B-rep mathematical contracts
        run: cargo test --test boolean_box
      - name: Boolean CLI exact volume and failure semantics
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"boolean","mode":"intersection","left":{"kind":"block","origin":[0,0,0],"width":2,"height":3,"depth":4},"right":{"kind":"block","origin":[1,1,1],"width":2,"height":3,"depth":4}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["solid"]["mass"]["volume"]==6.0 and r["solid"]["topology"]["euler_characteristic"]==2 and r["data"]["state"]=="solid" and len(r["data"]["face_sources"])==r["solid"]["topology"]["faces"], r'
          printf '%s' '{"operation":"boolean","mode":"difference","left":{"kind":"block","origin":[0,0,0],"width":3,"height":3,"depth":3},"right":{"kind":"block","origin":[1,1,1],"width":1,"height":1,"depth":1}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "topology not yet supported" in r["error"] and "solid" not in r, r'
      - name: Curved Boolean region membership and crossing decision witnesses
        run: cargo test --test boolean_region
      - name: Curved face-pair Boolean region CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"boolean_region_plan","mode":"difference","first":{"source":{"kind":"block","origin":[-3,2,-3],"width":6,"height":1,"depth":6},"face_id":0},"second":{"source":{"kind":"analytic_cylinder","origin":[0,0,0],"radius":2,"height":5},"face_id":2}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["state"]=="classified_preview" and d["can_apply"] is False and d["topology_committed"] is False and d["intersection_arcs"]==1 and len(d["region_samples"])==6, r'
      - name: True analytic through-hole B-rep, genus and parametric edit contracts
        run: cargo test --test through_hole
      - name: Through-hole Boolean geometry.v1 CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"boolean","mode":"difference","left":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"right":{"kind":"analytic_cylinder","origin":[0,-1,0],"radius":1,"height":4}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys,math; r=json.load(sys.stdin); d=r["data"]; s=r["solid"]; assert r["ok"] and d["representation"]=="analytic_cylindrical_through_hole" and d["genus"]==1 and d["topology_committed"] and s["topology"]["euler_characteristic"]==0 and s["analytic_brep"]["inner_loops"]==2 and abs(s["mass"]["volume"]-(144-4*math.pi))<1e-9, r'
      - name: Canonical generational B-rep carrier editor and strong atomicity
        run: cargo test --test carrier_editor
      - name: Independent carrier edit CLI and reject-without-partial-output checks
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"carrier_transaction","source":{"kind":"block","origin":[0,0,0],"width":2,"height":3,"depth":4},"batches":[[{"kind":"reparameterize_edge","edge_id":0,"scale":2,"offset":0.25},{"kind":"reparameterize_trim","coedge_id":0,"scale":1.5,"offset":0.125},{"kind":"rebase_face_uv","face_id":0,"du":0.5,"dv":-0.25}]],"undo":1,"redo":1}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["revision"]==3 and d["mass"]["volume"]==24.0 and d["shape_preserving"] and d["topology_mutated"] is False and len(d["commits"])==1, r'
          printf '%s' '{"operation":"carrier_transaction","source":{"kind":"analytic_through_hole","origin":[-3,-1,-3],"width":6,"height":4,"depth":6,"center":[0,0],"radius":1},"batches":[[{"kind":"reparameterize_edge","edge_id":12,"scale":1,"offset":0.5},{"kind":"rebase_face_uv","face_id":6,"du":0.25,"dv":0}]]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r and "error" in r, r'
      - name: Multi-hole structural topology, genus, handle and carrier transaction contracts
        run: cargo test --test structural_editor
      - name: Independent analytic genus-two structural B-rep JSON smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"structural_transaction","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"batches":[[{"kind":"add_through_hole","center":[-1.5,0],"radius":0.5},{"kind":"add_through_hole","center":[1.5,0],"radius":0.7},{"kind":"reparameterize_hole_edge","slot":1,"role":"bottom_circle","scale":1,"offset":0.4}]]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,math,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["hole_count"]==2 and d["topology"]["genus"]==2 and d["topology"]["inner_loops"]==4 and d["topology"]["euler_characteristic"]==-2 and d["topology_committed"] and d["display_mesh_available"] is True and d["display_mesh_included"] is False and abs(d["mass"]["volume"]-(144-4*math.pi*(0.25+0.49)))<1e-9, r'
          printf '%s' '{"operation":"structural_transaction","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"batches":[[{"kind":"add_through_hole","center":[-1.5,0],"radius":0.7},{"kind":"add_through_hole","center":[-1.4,0],"radius":0.8}]]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r, r'
      - name: Independent multi-loop planar face region and watertight mesh contracts
        run: cargo test --test multi_loop_mesh
      - name: Certified genus-two multi-hole mesh geometry.v1 API smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"structural_transaction","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"batches":[[{"kind":"add_through_hole","center":[-1.5,0],"radius":0.5},{"kind":"add_through_hole","center":[1.5,0],"radius":0.7}]],"display_segments":48}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import sys,json,math; r=json.load(sys.stdin); d=r["data"]; s=r["solid"]; q=d["display_quality"]; assert r["ok"] and d["topology"]["genus"]==2 and d["display_mesh_available"] and d["display_mesh_included"] and q["closed_oriented_manifold_certified"] and q["segments_per_hole"]==48 and q["volume_faceting_error"]>0 and s["topology"]["euler_characteristic"]==-2 and len(s["vertices"])==200 and len(s["faces"])==len(s["triangle_face_ids"]) and abs(s["mass"]["volume"]-(144-4*math.pi*(0.25+0.49)))<1e-9, r'
          printf '%s' '{"operation":"structural_transaction","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"batches":[[{"kind":"add_through_hole","center":[0,0],"radius":1}]],"display_segments":8}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import sys,json; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r and "segments" in r["error"], r'
      - name: Analytic top-entry blind hole B-rep, face regions and mass contracts
        run: cargo test --test blind_hole
      - name: Blind cylindrical difference and invalid source geometry.v1 smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"boolean","mode":"difference","left":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"right":{"kind":"analytic_cylinder","origin":[0,1,0],"radius":1,"height":2}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,math,sys; r=json.load(sys.stdin); s=r["solid"]; d=r["data"]; assert r["ok"] and d["representation"]=="analytic_cylindrical_blind_hole" and d["opening_inner_loops"]==1 and d["floor_face_id"]==7 and d["source_opening_trace"]["arcs"]==1 and d["source_opening_trace"]["closed"] and d["closed_oriented_display_mesh_certified"] and s["topology"]["faces"]==8 and s["topology"]["euler_characteristic"]==2 and s["analytic_brep"]["inner_loops"]==1 and abs(s["mass"]["volume"]-(144-2*math.pi))<1e-9 and abs(s["mass"]["surface_area"]-(168+4*math.pi))<1e-9, r'
          printf '%s' '{"operation":"boolean","mode":"difference","left":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"right":{"kind":"analytic_cylinder","origin":[0,1,0],"radius":1,"height":1.99999999}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r, r'
      - name: Composite analytic blind-hole B-rep region and mass contracts
        run: cargo test --test composite_blind
      - name: Composite blind-hole geometry.v1 success and refusal smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"compose_blind","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"holes":[{"center":[-1.5,0],"radius":0.6,"depth":1.2},{"center":[1.5,0],"radius":0.7,"depth":2.4}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,math,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["topology_committed"] and d["topology"]["faces"]==10 and d["topology"]["genus"]==0 and d["topology"]["euler_characteristic"]==2 and d["topology"]["inner_loops"]==2 and d["floors"]==[7,9] and abs(d["mass"]["volume"]-(144-math.pi*(0.36*1.2+0.49*2.4)))<1e-9, r'
          printf '%s' '{"operation":"compose_blind","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"holes":[{"center":[-1,0],"radius":1,"depth":1},{"center":[0,0],"radius":1,"depth":2}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r, r'
      - name: Real crossing-arc Boolean B-rep and atomic region reassembly contracts
        run: cargo test --test intersecting_blind
      - name: Crossing-cylinder region and watertight display mesh mathematical contracts
        run: cargo test --test intersecting_blind_mesh
      - name: Source-bound overlapping blind Boolean geometry.v1 and fail-closed regression
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"compose_intersecting_blind","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"holes":[{"center":[-0.7,0],"radius":1,"depth":2},{"center":[0.7,0],"radius":1,"depth":2}],"display_segments":48}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,math,sys; r=json.load(sys.stdin); d=r["data"]; s=r["solid"]; q=d["display_quality"]; assert r["ok"] and d["topology_committed"] and d["topology"]["faces"]==9 and d["topology"]["edges"]==18 and d["topology"]["genus"]==0 and d["topology"]["inner_loops"]==1 and d["region"]["state"]=="certified_transverse_crossing" and d["region"]["shared_vertical_edges"]==[16,17] and len(d["region"]["arc_sources"])==2 and d["display_mesh_included"] and q["closed_oriented_manifold_certified"] and q["segments_per_arc"]==48 and len(s["faces"])==396 and len(s["triangle_face_ids"])==396 and abs(s["mass"]["volume"]-(144-2*d["region"]["disk_union_area"]))<1e-9, r'
          printf '%s' '{"operation":"compose_intersecting_blind","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"holes":[{"center":[-0.7,0],"radius":1,"depth":2},{"center":[1.3,0],"radius":1,"depth":2}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r, r'
      - name: Compound mixed crossing and independent analytical B-rep region contracts
        run: cargo test --test compound_blind
      - name: Mixed analytic blind floor watertight display and mass convergence
        run: cargo test --test compound_blind_mesh
      - name: Compound crossing and disjoint blind region geometry.v1 success and failure gates
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"compose_blind_regions","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"holes":[{"center":[-1.5,-0.5],"radius":0.75,"depth":1.8},{"center":[-0.4,-0.5],"radius":0.7,"depth":1.8},{"center":[1.7,1.2],"radius":0.55,"depth":2.6}],"display_segments":48}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import sys,json,math; r=json.load(sys.stdin); d=r["data"]; s=r["solid"]; q=d["display_quality"]; assert r["ok"] and d["topology_committed"] and d["hole_count"]==3 and d["component_count"]==2 and d["topology"]["faces"]==11 and d["topology"]["inner_loops"]==2 and d["topology"]["genus"]==0 and d["components"][0]["kind"]=="two_crossing_circles" and d["components"][1]["kind"]=="single_circle" and q["closed_oriented_manifold_certified"] and q["top_face_loop_count"]==3 and len(q["floor_regions"])==2 and len(s["vertices"])==296 and len(s["faces"])==588 and len(s["faces"])==len(s["triangle_face_ids"]) and abs(s["mass"]["volume"]-d["mass"]["volume"])<1e-9, r'
          printf '%s' '{"operation":"compose_blind_regions","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"holes":[{"center":[-1,0],"radius":0.9,"depth":2},{"center":[0,0],"radius":0.9,"depth":2},{"center":[1,0],"radius":0.9,"depth":2}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import sys,json; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r, r'
      - name: Connected three-cylinder global arc atoms and 3D physical halfedge incidence
        run: cargo test --test connected_triple_stitch
      - name: Source-certified connected triple canonical analytic B-rep and exact centroid
        run: cargo test --test connected_triple_brep
      - name: Source-certified connected triple watertight display and volume convergence
        run: cargo test --test connected_triple_mesh
      - name: Connected three-cylinder global edge stitching JSON parser and held-state checks
        run: cargo test --bin gefest-geometry connected_triple_cli
      - name: Three-body chain with distinct blind depths and closed 3D physical incidence JSON smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"connected_triple_stitch_plan","source":{"kind":"block","origin":[-4,-2,-3],"width":8,"height":5,"depth":6},"through":{"center":[-1.15,0],"radius":0.8},"deeper_blind":{"center":[0,0],"radius":0.8,"depth":2.8},"shallower_blind":{"center":[1.15,0],"radius":0.8,"depth":1.2}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["state"]=="ready" and len(d["floor_interfaces"])==2 and len(d["edge_incidence"])==26 and d["predicted_shell"]["euler"]==0 and d["predicted_shell"]["genus"]==1 and d["predicted_shell"]["edges"]==38 and d["can_apply"] is False and d["topology_committed"] is False,r'
      - name: Multi-cluster crossing B-rep, cross-layer topology and certified watertight display
        run: cargo test --test composed_crossing_brep
      - name: Multi-aperture composed crossing geometry.v1 adapter tests
        run: cargo test --bin gefest-geometry composed_crossing_cli
      - name: Certified composed through-blind crossing shells geometry.v1 smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"compose_crossing_clusters","source":{"kind":"block","origin":[-5,-1,-4],"width":10,"height":4,"depth":8},"pairs":[{"through":{"center":[-2,0],"radius":0.45},"blind":{"center":[-1.55,0],"radius":0.45,"depth":1.5}},{"through":{"center":[1.5,0],"radius":0.5},"blind":{"center":[2,0],"radius":0.5,"depth":2.5}}],"display_segments":32}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; s=r["solid"]; assert r["ok"] and d["state"]=="committed" and d["topology"]["genus"]==2 and d["topology"]["coedges"]==68 and d["source_slab_count"]==3 and d["display_quality"]["closed_oriented_manifold_certified"] and len(s["faces"])==len(s["triangle_face_ids"]) and abs(d["mass"]["volume"]-d["slab_analytic_volume"])<1e-9,r'
          printf '%s' '{"operation":"compose_crossing_clusters","source":{"kind":"block","origin":[-5,-1,-4],"width":10,"height":4,"depth":8},"pairs":[{"through":{"center":[-2,0],"radius":0.45},"blind":{"center":[-1.55,0],"radius":0.45,"depth":1.5}}],"isolated_blind":[{"center":[-2,0.85],"radius":0.4,"depth":1.0}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r,r'
      - name: Multi-circle source-bound slab arrangement and independent strip quadrature
        run: cargo test --test multi_cut_regions
      - name: Multi-cylinder layered region geometry.v1 parser and fail-closed checks
        run: cargo test --bin gefest-geometry multi_cut_regions_cli
      - name: Three interacting cylinders with different blind depths geometry.v1 smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"multi_cut_region_plan","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"through":[{"center":[0,0],"radius":0.75}],"blind":[{"center":[0.7,0],"radius":0.75,"depth":2},{"center":[1.4,0.25],"radius":0.6,"depth":1}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["state"]=="ready" and len(d["slabs"])==3 and d["slabs"][-1]["active_disks"]==[0,1,2] and d["predicted_remaining_volume"]>0 and d["can_apply"] is False and d["topology_committed"] is False,r'
          printf '%s' '{"operation":"multi_cut_region_plan","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"through":[{"center":[0,0],"radius":0.7}],"blind":[{"center":[1.4,0],"radius":0.7,"depth":1.5}]}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["state"]=="held" and d["hold_reason"]=="near_tangency_or_coincidence" and d["predicted_remaining_volume"] is None and d["can_apply"] is False,r'
      - name: Read-only analytical through/blind crossing support patches and no-commit checks
        run: cargo test --test mixed_crossing_surfaces
      - name: Certified intersecting through/blind source B-rep coedge and history contracts
        run: cargo test --test mixed_crossing_brep
      - name: Certified watertight crossed through/blind display, genus and mass convergence
        run: cargo test --test mixed_crossing_mesh
      - name: Execute source-bound mixed-crossing B-rep JSON adapter regression
        run: cargo test --bin gefest-geometry mixed_crossing_cli
      - name: Certified crossed through/blind B-rep and mesh geometry.v1 smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"compose_mixed_crossing","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"through":{"center":[0,0],"radius":0.5},"blind":{"center":[0.5,0],"radius":0.5,"depth":1.5},"display_segments":32}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; s=r["solid"]; assert r["ok"] and d["topology_committed"] and d["representation"]=="analytic_crossing_through_blind" and d["topology"]["genus"]==1 and d["topology"]["coedges"]==46 and d["display_quality"]["closed_oriented_manifold_certified"] and s["analytic_brep"]["genus"]==1 and abs(s["mass"]["volume"]-140.14094873829234)<1e-9 and len(s["faces"])==len(s["triangle_face_ids"]),r'
          printf '%s' '{"operation":"compose_mixed_crossing","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"through":{"center":[0,0],"radius":0.5},"blind":{"center":[1,0],"radius":0.5,"depth":1.5},"display_segments":32}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["ok"] and "solid" not in r and "data" not in r,r'
      - name: Independent v0.30 mixed through/blind footprint and numerical quadrature contracts
        run: cargo test --test mixed_footprint
      - name: v0.30 read-only mixed overlap CLI success and held-contact checks
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"mixed_footprint_overlap_plan","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"through":{"center":[0,0],"radius":0.5},"blind":{"center":[0.5,0],"radius":0.5,"depth":1.5}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["state"]=="two_transverse_crossings" and d["can_apply"] is False and d["topology_committed"] is False and len(d["crossings"])==2 and len(d["exposed_arcs"])==2 and abs(d["predicted_remaining_volume"]-140.14094873829234)<1e-9, r'
          printf '%s' '{"operation":"mixed_footprint_overlap_plan","source":{"kind":"block","origin":[-3,-1,-3],"width":6,"height":4,"depth":6},"through":{"center":[0,0],"radius":0.5},"blind":{"center":[1,0],"radius":0.5,"depth":1.5}}' \
            | cargo run --quiet --bin gefest-geometry \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); d=r["data"]; assert r["ok"] and "solid" not in r and d["state"]=="held_near_tangency" and d["overlap_area"] is None and d["predicted_remaining_volume"] is None and d["can_apply"] is False, r'
      - name: Heterogeneous through/blind analytical shell genus and atomic source contracts
        run: cargo test --test mixed_regions
      - name: Mixed through/blind top and bottom cap trim meshing and mass convergence
        run: cargo test --test mixed_regions_mesh
      - name: Independent mixed through/blind geometry.v1 analytic and watertight smoke
        shell: bash
        run: |
          set -euo pipefail
